# Pembaruan keamanan dependensi datang sebagai PR ke `dev`, dikelompokkan
# supaya tidak membanjiri antrean dengan satu PR per paket.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
