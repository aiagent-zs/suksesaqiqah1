# Analisis statis keamanan (SAST): injeksi, XSS, rahasia yang ditulis di kode.
# Hasilnya tampil di tab Security > Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '23 2 * * 1' # Senin 09:23 WIB: menangkap aturan baru tanpa menunggu commit

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
